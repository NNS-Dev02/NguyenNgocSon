<style type="text/css">
body, div, canvas
{
    image-rendering: optimizeSpeed;
    -webkit-image-rendering: optimizeSpeed;
    -webkit-interpolation-mode: nearest-neighbor;
}
body{padding:0; margin:0;font-size:12px;background-color:#000;}
body, html{height: 100%;}
#outer{height:100%; overflow:hidden; position:relative; width:100%;}
#outer[id]{display:table; position:static;}
#middle{position:absolute; top:50%;} /* for ie only*/
#middle[id]{display:table-cell; vertical-align:middle; position:static;}



/* giao diện menu nâng cấp */

/* Menu nâng cấp */
#upgradeMenu {
    position: absolute;
    left: 20px;
    top: 30px;
    width: 150px;
    background: rgba(0, 0, 0, 0.8);
    padding: 15px;
    color: #fff;
    border-radius: 10px;
    text-align: center;
    font-family: Arial, sans-serif;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);

    /* Thêm viền vàng */
    border: 3px solid #FFD700; 

    /* Hiệu ứng phát sáng */
    box-shadow: 0px 0px 15px #FFD700;
}

/* Tiêu đề menu */
#upgradeMenu h3 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: bold;
    color: #FFD700;
}

/* Nút nâng cấp */
.upgrade-btn {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #ff9800, #ff5722);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s ease-in-out;
}

/* Hiệu ứng khi rê chuột vào */
.upgrade-btn:hover {
    background: linear-gradient(45deg, #ff5722, #e91e63);
    transform: scale(1.05);
}

/* Hiệu ứng khi bấm vào */
.upgrade-btn:active {
    transform: scale(0.95);
}

.upgrade-btn:disabled {
    background: #444 !important; /* Tô màu xám đậm */
    color: #aaa !important; /* Chữ xám nhạt */
    cursor: not-allowed !important; /* Biểu tượng chuột bị khóa */
    box-shadow: none !important; /* Bỏ hiệu ứng bóng */
    transform: none !important; /* Không có hiệu ứng hover */
}


/* Ô code */

/* Định vị ô nhập mã */
#redeemSection {
    position: absolute;
    left: 20px; /* Đặt ở bên trái */
    bottom: 30px; /* Cùng hàng với menu nâng cấp */
    width: 150px;
    background: rgba(0, 0, 0, 0.8);

    color: #fff;
    border-radius: 10px;
    text-align: center;
    border: 2px solid #FFD700;
    box-shadow: 0px 0px 10px #FFD700;
}

/* Tiêu đề */
#redeemSection h3 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: bold;
    color: #FFD700;
}

/* Ô nhập mã */
#redeemCodeInput {
    width: 130px;
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #FFD700;
    text-align: center;
    font-size: 14px;
    background: #222;
    color: #FFD700;
}

/* Nút xác nhận */
#redeemCodeBtn {
    width: 100%;
    margin-top: 5px;
    padding: 5px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #ff9800, #ff5722);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s ease-in-out;
}

#redeemCodeBtn:hover {
    background: linear-gradient(45deg, #ff5722, #e91e63);
    transform: scale(1.05);
}

/* Thông báo khi nhập mã */
#redeemMessage {
    margin-top: 5px;
    font-size: 12px;
    color: #FFD700;
}

<!-- Nâng cấp đạn bắn ra -->
<script>
	document.querySelector(".upgrade-btn[data-upgrade='extraBullets'][data-value='2']")
    .addEventListener("click", function () {
        var upgradeCost = 1000;
        var button = this;

        if (typeof game !== "undefined" && game.player) {
            if (game.player.coin >= upgradeCost) {
                game.player.updateCoin(-upgradeCost, true);
                game.player.extraBullets = 2;
                console.log("🚀 Đã nâng cấp! Số đạn hiện tại:", game.player.extraBullets);
                alert("🎯 Đã nâng cấp! Giờ bạn bắn ra 3 viên đạn cùng lúc.");

                // Vô hiệu hóa nút sau khi mua
                button.disabled = true;
                button.style.background = "#888";
                button.style.cursor = "not-allowed";
                button.innerText = "Đã mua";

                // Mở khóa nút "Thêm 4 tia đạn"
                var nextUpgrade = document.querySelector(".upgrade-btn[data-upgrade='extraBullets'][data-value='4']");
                nextUpgrade.disabled = false;
                nextUpgrade.style.background = "linear-gradient(45deg, #ff9800, #ff5722)"; // Đổi lại màu sáng
                nextUpgrade.style.color = "white"; // Đổi lại màu chữ trắng
                nextUpgrade.style.cursor = "pointer"; // Cho phép bấm
                nextUpgrade.innerText = "3000 🪙"; // Đổi lại chữ thành giá tiền
            } else {
                alert("⚠ Không đủ vàng!");
            }
        } else {
            console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
        }
    });

	
	// Nâng cấp lên 5 viên đạn
	document.querySelector(".upgrade-btn[data-upgrade='extraBullets'][data-value='4']")
		.addEventListener("click", function () {
			var upgradeCost = 3000;
			var button = this; // Lưu tham chiếu tới nút
	
			if (typeof game !== "undefined" && game.player) {
				if (game.player.coin >= upgradeCost) {
					game.player.updateCoin(-upgradeCost, true);
					game.player.extraBullets = 4; // Bắn 5 viên
					console.log("🚀 Đã nâng cấp! Số đạn hiện tại:", game.player.extraBullets);
					alert("🎯 Đã nâng cấp! Giờ bạn bắn ra 5 viên đạn cùng lúc.");
	
					// Vô hiệu hóa nút sau khi mua
					button.disabled = true;
					button.style.background = "#888"; // Màu xám
					button.style.cursor = "not-allowed";
					button.innerText = "Đã mua";
				} else {
					alert("⚠ Không đủ vàng!");
				}
			} else {
				console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
			}
		});
	</script>

<!-- Nhập code nhận thưởng -->
 <script>
	document.getElementById("redeemCodeInput").addEventListener("input", function () {
    this.value = this.value.toUpperCase(); // Chuyển thành chữ in hoa khi nhập
});

document.getElementById("redeemCodeBtn").addEventListener("click", function () {
    var inputCode = document.getElementById("redeemCodeInput").value.trim().toUpperCase(); // Chuyển thành chữ hoa
    var message = document.getElementById("redeemMessage");

    // Danh sách mã hợp lệ
    var validCodes = {
        "ANHSONCHA500": { reward: "coin", amount: 500, message: "🎁 Bạn nhận được 500 🪙!" },
        "ANHSONCHA+3": { reward: "extraBullets", amount: 2, message: "🔫 Bạn được nâng cấp lên 3 tia đạn!" },
        "ANHSONCHAX2": { reward: "fireSpeedMultiplier", amount: 2, message: "⚡ Tốc độ bắn x2 đã được kích hoạt!" }
    };

    if (typeof game !== "undefined" && game.player) {
        if (validCodes[inputCode]) {
            var rewardData = validCodes[inputCode];

            // Kiểm tra xem mã đã được dùng chưa
            if (localStorage.getItem("usedCode_" + inputCode)) {
                message.style.color = "red";
                message.innerText = "❌ Mã này đã được sử dụng!";
                return;
            }

            // Áp dụng phần thưởng
            if (rewardData.reward === "coin") {
                game.player.updateCoin(rewardData.amount, true);
            } else if (rewardData.reward === "extraBullets") {
                game.player.extraBullets = rewardData.amount;
            } else if (rewardData.reward === "fireSpeedMultiplier") {
                game.fireInterval = Math.max(10, game.fireInterval / rewardData.amount);
            }

            // Đánh dấu mã đã sử dụng
            localStorage.setItem("usedCode_" + inputCode, "true");

            // Hiển thị thông báo thành công
            message.style.color = "#FFD700";
            message.innerText = rewardData.message;
        } else {
            message.style.color = "red";
            message.innerText = "❌ Mã không hợp lệ!";
        }
    } else {
        console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
    }
});

 </script>
