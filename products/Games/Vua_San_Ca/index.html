<!doctype html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="apple-touch-startup-image" href="images/icon.png" />

    <style type="text/css">
        body,
        div,
        canvas {
            image-rendering: optimizeSpeed;
            -webkit-image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
        }
        
        body {
            padding: 0;
            margin: 0;
            font-size: 12px;
            background-color: #000;
        }
        
        body,
        html {
            height: 100%;
        }
        
        #outer {
            height: 100%;
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        
        #outer[id] {
            display: table;
            position: static;
        }
        
        #middle {
            position: absolute;
            top: 50%;
        }
        /* for ie only*/
        
        #middle[id] {
            display: table-cell;
            vertical-align: middle;
            position: static;
        }
        /* giao diện menu nâng cấp */
        /* Menu nâng cấp */
        
        #upgradeMenu {
            position: absolute;
            left: 20px;
            /* Nằm sát bên trái */
            
            top: 70px;
            width: 333px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            color: #fff;
            border-radius: 10px;
            text-align: center;
            font-family: Arial, sans-serif;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            border: 3px solid #FFD700;
            box-shadow: 0px 0px 15px #FFD700;
            display: none;
            /* Ẩn mặc định */
        }
        /* Nút mở menu */
        
        #toggleMenuBtn {
            position: absolute;
            left: 50px;
            /* Nằm sát bên trái */
            
            top: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }
        
        #toggleMenuBtn:hover {
            background: linear-gradient(45deg, #ff5722, #e91e63);
            transform: scale(1.05);
        }
        
        .upgrade-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* Căn đều */
            
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: 0.3s;
        }
        
        .upgrade-item span {
            flex-grow: 1;
            /* Tự giãn khoảng cách */
            
            font-size: 14px;
            font-weight: bold;
            color: #FFD700;
            /* Màu vàng nổi bật */
            
            text-shadow: 1px 1px 5px rgba(255, 215, 0, 0.5);
        }
        /* Nút nâng cấp */
        
        .upgrade-btn {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        /* Hiệu ứng hover */
        
        .upgrade-btn:hover {
            background: linear-gradient(45deg, #ff5722, #e91e63);
            transform: scale(1.05);
        }
        /* Nút bị khóa */
        
        .upgrade-btn:disabled {
            background: #444 !important;
            /* Xám đậm */
            
            color: #aaa !important;
            /* Chữ xám nhạt */
            
            cursor: not-allowed !important;
            box-shadow: none;
            transform: none;
        }
        /* Nhập mã code trong cửa hàng */
        
        #redeemSection {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            border: 2px solid #FFD700;
        }
        
        #redeemCodeInput {
            width: 70%;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #FFD700;
            text-align: center;
            font-size: 14px;
            background: #222;
            color: #FFD700;
            text-transform: uppercase;
            /* Chỉ nhập chữ in hoa */
        }
        
        #redeemCodeBtn {
            width: 50%;
            margin-top: 10px;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #redeemCodeBtn:hover {
            background: linear-gradient(45deg, #ff5722, #e91e63);
            transform: scale(1.05);
        }
        
        #redeemMessage {
            margin-top: 5px;
            font-size: 12px;
            color: #FFD700;
        }

        /* Hộp thông báo */
        #customAlert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #FFD700;
            box-shadow: 0px 0px 15px #FFD700;
            min-width: 250px;
            z-index: 1000;
        }

        /* Nút OK */
        #customAlert button {
            margin-top: 10px;
            padding: 10px;
            border: none;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        #customAlert button:hover {
            background: linear-gradient(45deg, #ff5722, #e91e63);
            transform: scale(1.05);
        }

    </style>

    <title>Vua Săn Cá</title>

    <script type="text/javascript" src="js/quark.base-1.0.0.alpha.min.js"></script>

    <script type="text/javascript" src="src/R.js"></script>
    <script type="text/javascript" src="src/Utils.js"></script>
    <script type="text/javascript" src="src/fishjoy.js"></script>
    <script type="text/javascript" src="src/FishManager.js"></script>
    <script type="text/javascript" src="src/FishGroup.js"></script>
    <script type="text/javascript" src="src/views/Fish.js"></script>
    <script type="text/javascript" src="src/views/Cannon.js"></script>
    <script type="text/javascript" src="src/views/Bullet.js"></script>
    <script type="text/javascript" src="src/views/Num.js"></script>
    <script type="text/javascript" src="src/views/Player.js"></script>

<body>

    <!-- Hộp thông báo tùy chỉnh -->
    <div id="customAlert">
        <p id="showAlertMessage">Thông báo!</p>
        <button onclick="closeAlert()">OK</button>
    </div>


    <div id="outer">
        <div id="middle">
            <div id="container" style="position:relative;margin:0 auto;"></div>
            <div id="msg"></div>

            <button id="toggleMenuBtn">📜 Cửa hàng</button>

            <div id="upgradeMenu">
                <h3>CỬA HÀNG</h3>

                <div class="upgrade-item">
                    <span>🔫 Số tia đạn hiện tại: <span id="bulletCount">1</span></span>
                    <button class="upgrade-btn" id="upgradeBulletBtn">1000 🪙</button>
                </div>

                <div class="upgrade-item">
                    <span>⚡ Tốc độ bắn hiện tại: <span id="fireRateMultiplier">x1</span></span>
                    <button id="upgradeFireRateBtn" class="upgrade-btn">2000 🪙</button>
                </div>

                <div class="upgrade-item">
                    <span>🔄 Đạn quay ngược lại</span>
                    <button class="upgrade-btn" data-upgrade="bounceBullets" data-value="true" data-cost="2000">2000 🪙</button>
                </div>

                <div class="upgrade-item">
                    <span>🤡 Tăng sức mạnh tinh thần</span>
                    <button class="upgrade-btn" data-upgrade="enableMusic" data-value="true" data-cost="100">100 🪙</button>
                </div>

                <!-- Nhập mã code ngay trong menu -->
                <div id="redeemSection">
                    <h3>🎁 NHẬP CODE</h3>
                    <input type="text" id="redeemCodeInput" placeholder="Nhập mã code..." />
                    <button id="redeemCodeBtn">Xác nhận</button>
                    <p id="redeemMessage"></p>
                </div>

            </div>


        </div>
    </div>
    <div id="fps" style="position:absolute;top:0;left:0;color:#fff;"></div>


    <!-- Nâng cấp đạn bắn ra -->
    <script>
        document.getElementById("upgradeBulletBtn").addEventListener("click", function() {
            var button = this;

            if (typeof game !== "undefined" && game.player) {
                if (game.player.extraBullets === undefined) {
                    game.player.extraBullets = 0;
                }

                var currentBullets = game.player.extraBullets;

                if (currentBullets >= 9) {
                    button.disabled = true;
                    button.style.background = "#888";
                    button.style.cursor = "not-allowed";
                    button.innerText = "Đã đạt tối đa";
                    return;
                }

                // Tính giá nâng cấp (Lần đầu = 1000, sau đó tăng dần lên tới 9000)
                var upgradeCost = (currentBullets === 0) ? 1000 : (currentBullets + 1) * 1000;

                // Đảm bảo lần nâng cấp cuối cùng (9 → 10) chỉ tốn 9000
                if (currentBullets === 8) {
                    upgradeCost = 9000;
                }

                if (game.player.coin >= upgradeCost) {
                    game.player.updateCoin(-upgradeCost, true);
                    game.player.extraBullets = currentBullets + 1;

                    document.getElementById("bulletCount").innerText = game.player.extraBullets + 1;

                    var nextUpgradeCost = (game.player.extraBullets + 1) * 1000;
                    if (game.player.extraBullets === 9) {
                        button.disabled = true;
                        button.style.background = "#888";
                        button.style.cursor = "not-allowed";
                        button.innerText = "Đạt cấp tối đa";
                    } else {
                        // Nếu lần tiếp theo là lần cuối (9 → 10), thì giá = 9000
                        if (game.player.extraBullets === 8) {
                            nextUpgradeCost = 9000;
                        }
                        button.innerText = `${nextUpgradeCost} 🪙`;
                    }

                    console.log(`🚀 Đã nâng cấp! Số đạn hiện tại: ${game.player.extraBullets + 1}`);
                } else {
                    showAlert("⚠️️️️️️️️ Không đủ vàng!");
                }
            } else {
                console.log("❌ Lỗi: 'game.player' chưa được khởi tạo!");
            }
        });
    </script>


    <!-- Nâng cấp tốc độ bắn -->
    <script>
        document.getElementById("upgradeFireRateBtn").addEventListener("click", function() {
            var button = this;

            if (typeof game !== "undefined" && game.player) {
                if (game.player.fireSpeedMultiplier === undefined) {
                    game.player.fireSpeedMultiplier = 1; // Mặc định x1
                }

                var currentMultiplier = game.player.fireSpeedMultiplier;

                if (currentMultiplier >= 5) {
                    button.disabled = true;
                    button.style.background = "#888";
                    button.style.cursor = "not-allowed";
                    button.innerText = "Đã đạt tối đa";
                    return;
                }

                // Tính giá nâng cấp
                var upgradeCost = (game.player.fireSpeedMultiplier) * 1000 + 1000;

                if (game.player.coin >= upgradeCost) {
                    game.player.updateCoin(-upgradeCost, true);
                    game.player.fireSpeedMultiplier += 1;

                    // 🔥 Giảm `fireInterval` rõ ràng hơn sau mỗi lần nâng cấp
                    game.fireInterval = Math.max(5, game.fireInterval * 0.75);

                    document.getElementById("fireRateMultiplier").innerText = `x${game.player.fireSpeedMultiplier}`;

                    var nextUpgradeCost = (game.player.fireSpeedMultiplier) * 1000 + 1000;
                    if (game.player.fireSpeedMultiplier === 5) {
                        button.disabled = true;
                        button.style.background = "#888";
                        button.style.cursor = "not-allowed";
                        button.innerText = "Đã đạt tối đa";
                    } else {
                        button.innerText = `${nextUpgradeCost} 🪙`;
                    }

                    console.log(`🚀 Đã nâng cấp! Tốc độ bắn hiện tại: x${game.player.fireSpeedMultiplier}, fireInterval = ${game.fireInterval}ms`);
                } else {
                    showAlert("⚠️️️️️️️️ Không đủ vàng!");
                }
            } else {
                console.log("❌ Lỗi: 'game.player' chưa được khởi tạo!");
            }
        });
    </script>


    <!-- Nâng cấp đạn bật lại -->
    <script>
        document.querySelector(".upgrade-btn[data-upgrade='bounceBullets']")
            .addEventListener("click", function() {
                var upgradeCost = 2000;
                var button = this;

                if (typeof game !== "undefined" && game.player) {
                    if (game.player.coin >= upgradeCost) {
                        game.player.updateCoin(-upgradeCost, true);
                        game.bounceBullets = true; // Bật tính năng đạn quay ngược lại
                        console.log("🚀 Đã nâng cấp! Đạn bây giờ sẽ bật lại khi chạm biên.");
                        showAlert("🎯 Đã nâng cấp! Đạn sẽ bật lại khi chạm biên.");

                        // Vô hiệu hóa nút sau khi mua
                        button.disabled = true;
                        button.style.background = "#888";
                        button.style.cursor = "not-allowed";
                        button.innerText = "Đã mua";
                    } else {
                        showAlert("⚠️️️️️️️️ Không đủ vàng!");
                    }
                } else {
                    console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
                }
            });
    </script>


    <!-- Bật nhạc nền -->
    <audio id="backgroundMusic" loop>
        <source src="/NguyenNgocSon/products/Games/Vua_San_Ca/sounds/life_force.mp3" type="audio/mp3">
    </audio>

    <script>
        document.querySelector(".upgrade-btn[data-upgrade='enableMusic']")
            .addEventListener("click", function() {
                var upgradeCost = 100;
                var button = this;
;
                if (typeof game !== "undefined" && game.player) {
                    if (game.player.coin >= upgradeCost) {
                        game.player.updateCoin(-upgradeCost, true);

                        // Phát nhạc nền
                        var music = document.getElementById("backgroundMusic");
                        music.volume = 0.5; // Đặt âm lượng (0.0 - 1.0)
                        music.play().catch(error => console.log("⚠️️️️️️️️️ Không thể phát nhạc:", error));

                        console.log("🚀 Đã nâng cấp! Sức mạnh dâng cao 🤡.");
                        showAlert("Đã tăng sức mạnh tinh thần 🤡");

                        // Vô hiệu hóa nút sau khi mua
                        button.disabled = true;
                        button.style.background = "#888";
                        button.style.cursor = "not-allowed";
                        button.innerText = "Đã mua";
                    } else {
                        showAlert("⚠️️️️️️️️ Không đủ vàng!");
                    }
                } else {
                    console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
                }
            });
    </script>


    <!-- Nhập code nhận thưởng -->
    <script>
        document.getElementById("redeemCodeInput").addEventListener("input", function() {
            this.value = this.value.toUpperCase(); // Chuyển thành chữ in hoa khi nhập
        });

        document.getElementById("redeemCodeBtn").addEventListener("click", function() {
            var inputCode = document.getElementById("redeemCodeInput").value.trim().toUpperCase(); // Chuyển thành chữ hoa
            var message = document.getElementById("redeemMessage");

            // Danh sách mã hợp lệ
            var validCodes = {
                "SONCHA100000": {
                    reward: "coin",
                    amount: 100000,
                    message: "🎁 Bạn nhận được 100000 🪙!"
                },
                "SONCHA+15": {
                    reward: "extraBullets",
                    amount: 14,
                    message: "🔫 Bạn được nâng cấp lên 10 tia đạn!"
                },
                "SONCHAX100": {
                    reward: "fireSpeedMultiplier",
                    amount: 99,
                    message: "⚡ Tốc độ bắn x5 đã được kích hoạt!"
                }
            };

            if (typeof game !== "undefined" && game.player) {
                if (validCodes[inputCode]) {
                    var rewardData = validCodes[inputCode];

                    // Kiểm tra xem mã đã được dùng chưa
                    if (localStorage.getItem("usedCode_" + inputCode)) {
                        message.style.color = "red";
                        message.innerText = "❌ Mã này đã được sử dụng!";
                        return;
                    }

                    // Áp dụng phần thưởng
                    if (rewardData.reward === "coin") {
                        game.player.updateCoin(rewardData.amount, true);
                    } else if (rewardData.reward === "extraBullets") {
                        game.player.extraBullets = rewardData.amount;
                    } else if (rewardData.reward === "fireSpeedMultiplier") {
                        game.fireInterval = Math.max(10, game.fireInterval / rewardData.amount);
                    }

                    // Đánh dấu mã đã sử dụng
                    localStorage.setItem("usedCode_" + inputCode, "true");

                    // Hiển thị thông báo thành công
                    message.style.color = "#FFD700";
                    message.innerText = rewardData.message;
                } else {
                    message.style.color = "red";
                    message.innerText = "❌ Mã không hợp lệ!";
                }
            } else {
                console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
            }
        });
    </script>


    <!-- Menu -->
    <script>
        document.getElementById("toggleMenuBtn").addEventListener("click", function() {
            var menu = document.getElementById("upgradeMenu");
            if (menu.style.display === "none" || menu.style.display === "") {
                menu.style.display = "block"; // Hiện menu
            } else {
                menu.style.display = "none"; // Ẩn menu
            }
        });
    </script>


    <!-- Thông báo -->
    <script>
        // Hàm mở thông báo
        function showAlert(message) {
            document.getElementById("showAlertMessage").innerText = message;
            document.getElementById("customAlert").style.display = "block";
        }

        // Hàm đóng thông báo
        function closeAlert() {
            document.getElementById("customAlert").style.display = "none";
        }
    </script>

</body>
