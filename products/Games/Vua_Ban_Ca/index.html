<!doctype html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="images/icon.png"/>
<link rel="apple-touch-startup-image" href="images/icon.png" />

<style type="text/css">
body, div, canvas
{
    image-rendering: optimizeSpeed;
    -webkit-image-rendering: optimizeSpeed;
    -webkit-interpolation-mode: nearest-neighbor;
}
body{padding:0; margin:0;font-size:12px;background-color:#000;}
body, html{height: 100%;}
#outer{height:100%; overflow:hidden; position:relative; width:100%;}
#outer[id]{display:table; position:static;}
#middle{position:absolute; top:50%;} /* for ie only*/
#middle[id]{display:table-cell; vertical-align:middle; position:static;}



/* giao diện menu nâng cấp */

/* Menu nâng cấp */
#upgradeMenu {
    position: absolute;
    left: 10px; /* Đẩy menu sang phải */
    top: 50px;
    width: 180px;
    background: rgba(0, 0, 0, 0.8);
    padding: 15px;
    color: #fff;
    border-radius: 10px;
    text-align: center;
    font-family: Arial, sans-serif;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
}

/* Tiêu đề menu */
#upgradeMenu h3 {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: bold;
    color: #FFD700;
}

/* Nút nâng cấp */
.upgrade-btn {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #ff9800, #ff5722);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s ease-in-out;
}

/* Hiệu ứng khi rê chuột vào */
.upgrade-btn:hover {
    background: linear-gradient(45deg, #ff5722, #e91e63);
    transform: scale(1.05);
}

/* Hiệu ứng khi bấm vào */
.upgrade-btn:active {
    transform: scale(0.95);
}

</style>

<title>Vua Bắn Cá</title>
<!-- Icon WEBSITE -->
<link rel="shortcut icon" href="../../../assets/images/LogoMiniWebSite.png" type="image/x-icon">

<script type="text/javascript" src="js/quark.base-1.0.0.alpha.min.js"></script>
<!--<script type="text/javascript" src="fishjoy.game.js"></script>-->
<script type="text/javascript" src="src/R.js"></script>
<script type="text/javascript" src="src/Utils.js"></script>
<script type="text/javascript" src="src/fishjoy.js"></script>
<script type="text/javascript" src="src/FishManager.js"></script>
<script type="text/javascript" src="src/FishGroup.js"></script>
<script type="text/javascript" src="src/views/Fish.js"></script>
<script type="text/javascript" src="src/views/Cannon.js"></script>
<script type="text/javascript" src="src/views/Bullet.js"></script>
<script type="text/javascript" src="src/views/Num.js"></script>
<script type="text/javascript" src="src/views/Player.js"></script>

</head>

<body>

<div id="outer">
	<div id="middle">
		<div id="container" style="position:relative;margin:0 auto;"></div>
		<div id="msg"></div>

		<div id="upgradeMenu">
			<h3>NÂNG CẤP</h3>
		
			<div class="upgrade-item">
				<span>🔫 Thêm 2 tia đạn</span>
				<button class="upgrade-btn" data-upgrade="extraBullets" data-value="2" data-cost="1000">1000 vàng</button>
			</div>
		
			<div class="upgrade-item">
				<span>🔫 Thêm 4 tia đạn</span>
				<button class="upgrade-btn" data-upgrade="extraBullets" data-value="4" data-cost="3000">3000 vàng</button>
			</div>
		
			<div class="upgrade-item">
				<span>⚡ Tăng tốc độ bắn x2</span>
				<button class="upgrade-btn" data-upgrade="fireSpeedMultiplier" data-value="2" data-cost="1000">1000 vàng</button>
			</div>
		
			<div class="upgrade-item">
				<span>⚡ Tăng tốc độ bắn x5</span>
				<button class="upgrade-btn" data-upgrade="fireSpeedMultiplier" data-value="5" data-cost="3000">3000 vàng</button>
			</div>
		</div>		
	</div>
</div>
<div id="fps" style="position:absolute;top:0;left:0;color:#fff;"></div>


<script>
	document.querySelector(".upgrade-btn[data-upgrade='extraBullets'][data-value='2']")
		.addEventListener("click", function () {
			var upgradeCost = 1000;
			var button = this; // Lưu tham chiếu tới nút
	
			if (typeof game !== "undefined" && game.player) {
				if (game.player.coin >= upgradeCost) {
					game.player.updateCoin(-upgradeCost, true);
					game.player.extraBullets = 2; // Bắn 3 viên
					console.log("🚀 Đã nâng cấp! Số đạn hiện tại:", game.player.extraBullets);
					alert("🎯 Đã nâng cấp! Giờ bạn bắn ra 3 viên đạn.");
	
					// Vô hiệu hóa nút sau khi mua
					button.disabled = true;
					button.style.background = "#888"; // Màu xám
					button.style.cursor = "not-allowed";
					button.innerText = "Đã mua";
				} else {
					alert("⚠ Không đủ vàng!");
				}
			} else {
				console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
			}
		});
	
	// Nâng cấp lên 5 viên đạn
	document.querySelector(".upgrade-btn[data-upgrade='extraBullets'][data-value='4']")
		.addEventListener("click", function () {
			var upgradeCost = 3000;
			var button = this; // Lưu tham chiếu tới nút
	
			if (typeof game !== "undefined" && game.player) {
				if (game.player.coin >= upgradeCost) {
					game.player.updateCoin(-upgradeCost, true);
					game.player.extraBullets = 4; // Bắn 5 viên
					console.log("🚀 Đã nâng cấp! Số đạn hiện tại:", game.player.extraBullets);
					alert("🎯 Đã nâng cấp! Giờ bạn bắn ra 5 viên đạn.");
	
					// Vô hiệu hóa nút sau khi mua
					button.disabled = true;
					button.style.background = "#888"; // Màu xám
					button.style.cursor = "not-allowed";
					button.innerText = "Đã mua";
				} else {
					alert("⚠ Không đủ vàng!");
				}
			} else {
				console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
			}
		});
	</script>


<script>
	document.querySelector(".upgrade-btn[data-upgrade='fireSpeedMultiplier'][data-value='2']")
		.addEventListener("click", function () {
			var upgradeCost = 1000;
			var button = this;
	
			if (typeof game !== "undefined" && game.player) {
				if (game.player.coin >= upgradeCost) {
					game.player.updateCoin(-upgradeCost, true);
					game.fireInterval = Math.max(10, game.fireInterval / 2); // Giảm 2 lần
					console.log("🚀 Đã nâng cấp! Tốc độ bắn x2, fireInterval =", game.fireInterval);
					alert("🎯 Đã nâng cấp! Tốc độ bắn nhanh gấp đôi.");
	
					// Vô hiệu hóa nút sau khi mua
					button.disabled = true;
					button.style.background = "#888";
					button.style.cursor = "not-allowed";
					button.innerText = "Đã mua";
				} else {
					alert("⚠ Không đủ vàng!");
				}
			} else {
				console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
			}
		});
	
	// Nâng cấp tốc độ bắn x5
	document.querySelector(".upgrade-btn[data-upgrade='fireSpeedMultiplier'][data-value='5']")
		.addEventListener("click", function () {
			var upgradeCost = 3000;
			var button = this;
	
			if (typeof game !== "undefined" && game.player) {
				if (game.player.coin >= upgradeCost) {
					game.player.updateCoin(-upgradeCost, true);
					game.fireInterval = Math.max(5, game.fireInterval / 5); // Giảm 5 lần
					console.log("🚀 Đã nâng cấp! Tốc độ bắn x5, fireInterval =", game.fireInterval);
					alert("🎯 Đã nâng cấp! Tốc độ bắn nhanh gấp 5 lần.");
	
					// Vô hiệu hóa nút sau khi mua
					button.disabled = true;
					button.style.background = "#888";
					button.style.cursor = "not-allowed";
					button.innerText = "Đã mua";
				} else {
					alert("⚠ Không đủ vàng!");
				}
			} else {
				console.log("❌ Lỗi: `game.player` chưa được khởi tạo!");
			}
		});
	</script>
	
	

</body>

</html>
